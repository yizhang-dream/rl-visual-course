<script>
// 诊断浮层：把运行时错误直接显示在页面上（便于无控制台环境排查）
window.__errs = [];
window.addEventListener('error', function (e) {
  window.__errs.push(e.message);
  var d = document.getElementById('err-badge');
  if (!d) {
    d = document.createElement('div');
    d.id = 'err-badge';
    d.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:999;max-width:70vw;background:#c0392b;color:#fff;font:12px/1.5 monospace;padding:6px 10px;border-radius:8px;white-space:pre-wrap;';
    (document.body || document.documentElement).appendChild(d);
  }
  d.textContent += '⚠ ' + e.message + '\n  ' + (e.filename || '').split('/').pop() + ':' + e.lineno + '\n';
});
</script>
